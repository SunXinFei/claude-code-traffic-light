<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;place-items:center;background:#111;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.phone{width:390px;height:844px;border-radius:54px;overflow:hidden;position:relative;background:
radial-gradient(circle at 80% 70%,rgba(124,255,199,.35),transparent 35%),
radial-gradient(circle at 20% 80%,rgba(255,180,220,.18),transparent 35%),
radial-gradient(circle at 60% 20%,rgba(88,160,255,.25),transparent 40%),
linear-gradient(180deg,#0b1630,#14253f 45%,#182c44);
box-shadow:0 30px 70px rgba(0,0,0,.55)}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#000;border-radius:20px}
.logo{margin:84px auto 12px;width:72px;height:72px;border-radius:50%;background:#ef7f54;color:#fff;font-size:34px;display:grid;place-items:center}
h1{margin:0;text-align:center;color:#fff}.sub,.wait{color:#d8e4ff;text-align:center}.wait{margin:18px 0 26px}
.card{width:330px;margin:auto;padding:22px;border-radius:24px;background:rgba(255,255,255,.10);
border:1px solid rgba(255,255,255,.22);
backdrop-filter:blur(30px) saturate(180%);
-webkit-backdrop-filter:blur(30px) saturate(180%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 20px 50px rgba(0,0,0,.18)}
.title{color:#fff;font-weight:700}.cmd{margin:26px 0;color:#fff;font-size:28px;font-weight:300}
.detail{text-align:right;color:#f3f6ff}
.bottom{position:absolute;left:28px;right:28px;bottom:28px}
.decline{text-align:center;color:#fff;margin-bottom:14px}
.slider{height:62px;border-radius:31px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);position:relative;overflow:hidden;backdrop-filter:blur(24px)}
.slider:after{content:'';position:absolute;right:-20px;top:-10px;width:140px;height:80px;background:radial-gradient(circle,rgba(126,255,92,.9),rgba(126,255,92,.15) 55%,transparent 70%)}
.knob{position:absolute;left:4px;top:4px;width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;z-index:2}
.lbl{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;z-index:2}
</style></head><body><div class='phone'><div class='island'></div><div class='logo'>✺</div><h1>Claude</h1><div class='sub'>🔵 Your Project</div><div class='wait'>Waiting for your approval</div><div class='card'><div class='title'>Permission Request</div><div class='cmd'>npm install react-query</div><div class='detail'>View Details ›</div></div><div class='bottom'><div class='decline'>Decline</div><div class='slider'><div class='knob'>›</div><div class='lbl'>Slide to Approve</div></div></div></div></body></html>
