<!doctype html>
<html>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1'>
  <style>
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif
    }

    .phone {
      width: 390px;
      height: 844px;
      border-radius: 54px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 80% 70%, rgba(124, 255, 199, .35), transparent 35%),
        radial-gradient(circle at 20% 80%, rgba(255, 180, 220, .18), transparent 35%),
        radial-gradient(circle at 60% 20%, rgba(88, 160, 255, .25), transparent 40%),
        linear-gradient(180deg, #0b1630, #14253f 45%, #182c44);
      box-shadow: 0 30px 70px rgba(0, 0, 0, .55)
    }

    .island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 34px;
      background: #000;
      border-radius: 20px
    }

    .logo {
      margin: 84px auto 12px;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #ef7f54;
      color: #fff;
      font-size: 34px;
      display: grid;
      place-items: center
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #fff
    }

    .sub,
    .wait {
      color: #d8e4ff;
      text-align: center
    }

    .wait {
      margin: 18px 0 26px
    }

    .card {
      width: 330px;
      margin: auto;
      padding: 22px;
      border-radius: 24px;
      background: rgba(255, 255, 255, .10);
      border: 1px solid rgba(255, 255, 255, .22);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 20px 50px rgba(0, 0, 0, .18)
    }

    .title {
      color: #fff;
      font-weight: 700
    }

    .cmd {
      margin: 26px 0;
      color: #fff;
      font-size: 28px;
      font-weight: 300
    }

    .detail {
      text-align: right;
      color: #f3f6ff
    }

    .bottom {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 28px
    }

    .decline {
      text-align: center;
      color: #fff;
      margin-bottom: 14px
    }

    .slider {
      height: 76px;
      border-radius: 38px;
      position: relative;
      overflow: hidden;
      padding: 4px;
      background: #0b1630
    }

    /* 光带层：conic 铺满整个 slider 并旋转 */
    .slider::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: conic-gradient(from 0deg,
          transparent 0deg,
          rgba(126, 255, 92, 0) 240deg,
          rgba(126, 255, 92, .9) 320deg,
          rgba(126, 255, 92, 0) 360deg);
      animation: flow 3s linear infinite
    }

    /* 内层轨道：绝对不透明，盖死中间光带，只留 4px 边框光环 */
    .track {
      position: relative;
      height: 100%;
      border-radius: 34px;
      background: #14253f;
      z-index: 1;
      overflow: hidden
    }

    @keyframes flow {
      to {
        transform: rotate(360deg)
      }
    }

    .knob {
      position: absolute;
      left: 4px;
      top: 4px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
      display: grid;
      place-items: center;
      font-size: 24px;
      color: #0b1630;
      z-index: 3;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .25)
    }

    .lbl {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 700;
      z-index: 2;
      font-size: 16px
    }
  </style>
</head>

<body>
  <div class='phone'>
    <div class='island'></div>
    <div class='logo'>✺</div>
    <h1>Claude</h1>
    <div class='sub'>🔵 Your Project</div>
    <div class='wait'>Waiting for your approval</div>
    <div class='card'>
      <div class='title'>Permission Request</div>
      <div class='cmd'>npm install react-query</div>
      <div class='detail'>View Details ›</div>
    </div>
    <div class='bottom'>
      <div class='decline'>Decline</div>
      <div class='slider'>
        <div class='track'>
          <div class='knob'>›</div>
          <div class='lbl'>Slide to Approve</div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
